[project]
name = "attendance-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "customtkinter>=6.0.0",
    "email-validator>=2.3.0",
    "pillow>=12.2.0",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "nuitka>=4.1.3",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
