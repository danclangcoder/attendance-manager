[project]
name = "attendance-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "ctktooltip>=0.9",
    "customtkinter>=6.0.0",
    "email-validator>=2.3.0",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.2",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "pillow>=12.2.0",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "nuitka>=4.1.3",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[project.scripts]
app = "app.__main__:main"

[tool.ruff]
line-length = 120

[tool.ruff.format]
indent-style = "space"
quote-style = "single"
skip-magic-trailing-comma = true
